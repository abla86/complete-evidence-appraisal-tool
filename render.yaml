services:
  - type: web
    name: complete-evidence-appraisal-tool
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    # Trial registrations and synced records are written to EVIDENCE_DATA_DIR. Keep it on a persistent disk.
    disk:
      name: evidence-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_SESSION_SECRET
        generateValue: true
      # Licensing (see scripts/license-keygen.mjs). Private key is a secret; public key is a build argument.
      - key: LICENSE_PRIVATE_KEY
        sync: false
      - key: VITE_LICENSE_PUBLIC_KEY
        sync: false
      - key: VITE_SELLER_EMAIL
        sync: false
      - key: VITE_SELLER_VAT_REGISTERED
        sync: false
      - key: VITE_PUBLIC_SITE_URL
        sync: false
      # Stripe Payment Links (success URL: https://<domain>/purchase-complete?session_id={CHECKOUT_SESSION_ID})
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PAYMENT_LINK_ID_OFFLINE
        sync: false
      - key: STRIPE_PAYMENT_LINK_URL_OFFLINE
        sync: false
      - key: PRICE_LABEL_OFFLINE
        sync: false
      - key: STRIPE_PAYMENT_LINK_ID_ONLINE
        sync: false
      - key: STRIPE_PAYMENT_LINK_URL_ONLINE
        sync: false
      - key: PRICE_LABEL_ONLINE
        sync: false
      # Optional Google sign-in (trial, cloud sync) and optional AI.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: APP_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
