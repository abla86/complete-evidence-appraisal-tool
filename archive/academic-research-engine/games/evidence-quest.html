<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evidence Quest</title><style>body{margin:0;background:#081014;color:#dff;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{width:min(900px,92vw);text-align:center}canvas{width:100%;max-width:820px;background:#05090c;border:1px solid #245;border-radius:16px;touch-action:none}button{padding:10px 16px;margin:6px;border:1px solid #2aa;background:#0b1820;color:#dff;border-radius:8px;cursor:pointer}output{display:block;margin:10px;font:700 18px monospace}.hint{opacity:.75}</style></head><body><main><h1>Evidence Quest</h1><p>Research-method puzzle game.</p><output id="score">SCORE 0 · TIME 30</output><canvas id="game" width="820" height="460"></canvas><div><button id="start">Start / Restart</button><button id="pause">Pause</button></div><p class="hint">Fully playable browser game · vanilla JavaScript</p></main><script>
const c=document.getElementById('game'),x=c.getContext('2d'),scoreEl=document.getElementById('score');let running=false,paused=false,score=0,time=30,last=0,targets=[];
function spawn(){targets.push({x:25+Math.random()*770,y:25+Math.random()*410,r:10+Math.random()*14,vx:(Math.random()-.5)*80,vy:(Math.random()-.5)*80})}
function reset(){score=0;time=30;targets=[];for(let i=0;i<6;i++)spawn();running=true;paused=false}
document.getElementById('start').onclick=reset;document.getElementById('pause').onclick=()=>paused=!paused;
c.addEventListener('pointerdown',e=>{if(!running||paused)return;const r=c.getBoundingClientRect(),mx=(e.clientX-r.left)*c.width/r.width,my=(e.clientY-r.top)*c.height/r.height;for(let i=targets.length-1;i>=0;i--){let t=targets[i];if(Math.hypot(mx-t.x,my-t.y)<t.r+10){targets.splice(i,1);score+=10;spawn();break}}});
function loop(ts){let dt=Math.min(.05,(ts-last)/1000||0);last=ts;x.clearRect(0,0,c.width,c.height);if(running&&!paused){time-=dt;if(time<=0){time=0;running=false}targets.forEach(t=>{t.x+=t.vx*dt;t.y+=t.vy*dt;if(t.x<t.r||t.x>c.width-t.r)t.vx*=-1;if(t.y<t.r||t.y>c.height-t.r)t.vy*=-1})}targets.forEach(t=>{x.beginPath();x.arc(t.x,t.y,t.r,0,7);x.strokeStyle='#6ff';x.lineWidth=2;x.stroke();x.beginPath();x.arc(t.x,t.y,3,0,7);x.fillStyle='#fff';x.fill()});scoreEl.value='SCORE '+score+' · TIME '+Math.ceil(time);requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
