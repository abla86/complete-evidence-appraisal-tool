<!doctype html><html lang="no"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Evidence Map</title><style>body{font:16px system-ui;max-width:950px;margin:40px auto;padding:0 18px;background:#0d1117;color:#e6edf3}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.node{padding:14px;margin:8px 0;border:1px solid #30363d;border-radius:10px;cursor:pointer}.node:hover,.sel{border-color:#58a6ff;background:#161b22}.out{margin-top:18px;padding:18px;border:1px solid #30363d;border-radius:12px;min-height:70px}button{padding:10px;border:1px solid #30363d;border-radius:8px;background:#161b22;color:#e6edf3}</style><h1>Evidence Map</h1><p>Explore a synthetic evidence map by study design and confidence.</p><div class="toolbar"><button id="all">Vis alle</button><button id="reset">Nullstill</button></div><div id="nodes"></div><div class="out" id="out">Klikk på et element.</div><script>const data=['Discovery','Analysis','Decision','Action','Review'];const host=document.querySelector('#nodes'),out=document.querySelector('#out');function draw(filter=''){host.innerHTML=data.filter(x=>!filter||x===filter).map((x,i)=>'<div class="node" data-i="'+i+'"><b>'+(i+1)+'. '+x+'</b><br><small>syntetisk interaktiv tilstand</small></div>').join('');host.querySelectorAll('.node').forEach(n=>n.onclick=()=>{host.querySelectorAll('.node').forEach(x=>x.classList.remove('sel'));n.classList.add('sel');out.innerHTML='<b>'+data[n.dataset.i]+'</b><br>State: ACTIVE<br>Input/output relationship can be inspected here.'})}document.querySelector('#all').onclick=()=>draw();document.querySelector('#reset').onclick=()=>{draw();out.textContent='Klikk på et element.'};draw();</script></body></html>
