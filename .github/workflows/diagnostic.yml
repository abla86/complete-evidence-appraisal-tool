name: CI Diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: npm ci
        id: ci
        continue-on-error: true
        run: npm ci > diagnostic-npm-ci.log 2>&1
      - name: lint
        id: lint
        if: always()
        continue-on-error: true
        run: npm run lint > diagnostic-lint.log 2>&1
      - name: test
        id: test
        if: always()
        continue-on-error: true
        run: npm test > diagnostic-test.log 2>&1
      - name: build
        id: build
        if: always()
        continue-on-error: true
        run: npm run build > diagnostic-build.log 2>&1
      - name: summary
        if: always()
        run: |
          {
            echo "npm_ci=${{ steps.ci.outcome }}"
            echo "lint=${{ steps.lint.outcome }}"
            echo "test=${{ steps.test.outcome }}"
            echo "build=${{ steps.build.outcome }}"
          } > diagnostic-summary.txt
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: diagnostic-*.log
          if-no-files-found: warn
