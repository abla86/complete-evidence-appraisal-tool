name: Evidence Tool Artifacts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifacts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Collect build artifacts
        run: |
          rm -rf artifacts
          mkdir -p artifacts
          cp -r dist artifacts/dist
          cp package.json artifacts/package.json
          cp tsconfig.json artifacts/tsconfig.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evidence-tool-build
          path: artifacts/
          if-no-files-found: error
