name: Evidence Tool Artifacts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Typecheck
        run: npm run lint
      - name: Build project
        run: npm run build
      - name: Collect build artifacts
        run: |
          rm -rf artifacts
          mkdir -p artifacts
          cp -r dist artifacts/dist
          cp package.json artifacts/package.json
          cp package-lock.json artifacts/package-lock.json
          cp tsconfig.json artifacts/tsconfig.json
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evidence-tool-build
          path: artifacts/
          if-no-files-found: error
