name: CodeQL diagnostic
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  codeql-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: codeql-results
      - name: Print SARIF alerts
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, glob
          for p in glob.glob('codeql-results/*.sarif'):
              d=json.load(open(p, encoding='utf-8'))
              for run in d.get('runs', []):
                  for r in run.get('results', []):
                      loc=r.get('locations',[{}])[0].get('physicalLocation',{})
                      print(f"RULE={r.get('ruleId')} LEVEL={r.get('level')} FILE={loc.get('artifactLocation',{}).get('uri')} LINE={loc.get('region',{}).get('startLine')} MSG={r.get('message',{}).get('text')}")
          PY
