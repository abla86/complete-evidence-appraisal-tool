name: Batch Repair
on:
  push:
    branches: [repair/batch-fix]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply consolidated repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('.')
          def repair_mojibake(text: str) -> str:
              for _ in range(3):
                  if not any(x in text for x in ('Ã', 'Â', 'â')): break
                  try: fixed = text.encode('latin1').decode('utf-8')
                  except (UnicodeEncodeError, UnicodeDecodeError): break
                  if fixed == text: break
                  text = fixed
              return text
          for p in list((root/'src').rglob('*.ts')) + list((root/'src').rglob('*.tsx')):
              s = p.read_text(encoding='utf-8-sig'); fixed = repair_mojibake(s)
              if fixed != s: p.write_text(fixed, encoding='utf-8')
          p=root/'src/components/ArticleDetailView.tsx'; s=p.read_text(encoding='utf-8-sig'); s=s.replace("err instanceof Error ? err.message : 'Ukjent feil' || 'Kunne ikke gjenåpne'", "err instanceof Error ? err.message : 'Kunne ikke gjenåpne'"); p.write_text(s,encoding='utf-8')
          p=root/'src/components/MetaResearchLabView.tsx'; s=p.read_text(encoding='utf-8-sig'); s=s.replace("parseInt(report.extractedYear || '2024', 10) || 2024", "Number(report.extractedYear) || 2024"); p.write_text(s,encoding='utf-8')
          p=root/'src/components/PeerReviewStudioView.tsx'; s=p.read_text(encoding='utf-8-sig'); s=s.replace("setEvalOverallVerdict(mySubmission.overallVerdict);", "setEvalOverallVerdict(mySubmission.overallVerdict ?? 'Inkluder');"); s=s.replace("overallVerdict: currentConsensus.overallVerdict,", "overallVerdict: (currentConsensus.overallVerdict ?? 'Inkluder') as 'Inkluder' | 'Ekskluder' | 'Vurder videre' | 'Søk mer informasjon',"); s=s.replace("overallVerdict: selectedArticle?.overallVerdict || 'Inkluder',", "overallVerdict: (selectedArticle?.overallVerdict || 'Inkluder') as 'Inkluder' | 'Ekskluder' | 'Vurder videre' | 'Søk mer informasjon',"); needle="const consensusRecord: StudyConsensusRecord = {\n      studyId: selectedArticle.id,"; repl="const consensusRecord: StudyConsensusRecord = {\n      id: `consensus-${selectedArticle.id}-${Date.now()}`,\n      studyId: selectedArticle.id,\n      reviewerIds: workspace.members.slice(0, 2).map(m => m.id),\n      consensusStatus: consensusDraft.overallVerdict === 'Inkluder' ? 'Ja' : consensusDraft.overallVerdict === 'Ekskluder' ? 'Nei' : 'Uklart',\n      rationale: consensusDraft.verdictRationale || consensusDraft.consensusNotes || 'Konsensus fastsatt etter strukturert dobbeltgransking.',"; s=s.replace(needle,repl); p.write_text(s,encoding='utf-8')
          p=root/'src/components/UniversalAppraisalView.tsx'; s=p.read_text(encoding='utf-8-sig'); s=s.replace("verifiedBy?: string; verifiedAt?: string;", "verifiedBy?: string; verifiedAt?: string; verifiedByResearcher?: boolean;"); s=s.replace("<QualityAssessmentPanel appraisalSession={session} studyId={studyId} />", "<QualityAssessmentPanel session={session} />"); p.write_text(s,encoding='utf-8')
          p=root/'src/components/guidance/YggdrasilVisualizer.tsx'; s=p.read_text(encoding='utf-8-sig'); s=re.sub(r'(<div\\b[^>]*?)\\s+xmlns="[^"]+"',r'\\1',s); p.write_text(s,encoding='utf-8')
          p=root/'src/components/WhoValidationHubView.tsx'; s=p.read_text(encoding='utf-8-sig'); s=re.sub(r"(id:\s*'cerq-[^']+',\n\s*)reviewFinding:",r"\1finding: reviewFinding,\n      confidence: overallConfidence,\n      rationale: explanation,\n      reviewFinding:",s); p.write_text(s,encoding='utf-8')
          p=root/'src/services/methodologyContractTests.ts'; s=p.read_text(encoding='utf-8-sig'); s=s.replace("Agree2ScoringService.evaluate({ 1: 7, 2: 7, 3: 7 }, 1)","Agree2ScoringService.evaluate({ 1: 7, 2: 7, 3: 7 })"); s=s.replace("Agree2ScoringService.evaluate({ 1: 1, 2: 1, 3: 1 }, 1)","Agree2ScoringService.evaluate({ 1: 1, 2: 1, 3: 1 })"); s=s.replace("const robisEval = RobisValidationService.evaluate({\n      phase1PicoAddressed: true,\n      domain1Eligibility: 'Low risk',\n      domain2Identification: 'High risk',\n      domain3DataCollection: 'Low risk',\n      domain4Synthesis: 'Low risk'\n    });","const robisEval = RobisValidationService.evaluate({\n      phase2Domains: {\n        domain1Eligibility: 'Low risk',\n        domain2Identification: 'High risk',\n        domain3DataCollection: 'Low risk',\n        domain4Synthesis: 'Low risk'\n      }\n    });"); p.write_text(s,encoding='utf-8')
          p=root/'test/referenceHubDomain.test.ts'; s=p.read_text(encoding='utf-8-sig').replace("    type: 'JOURNAL_ARTICLE',","    kind: 'JOURNAL_ARTICLE',"); p.write_text(s,encoding='utf-8')
          PY
      - name: Typecheck
        run: npx tsc --noEmit --pretty false
      - name: Tests
        run: npm test -- --test-concurrency=1
      - name: Build
        run: npm run build
      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src test
          git diff --cached --quiet && exit 0
          git commit -m 'fix: consolidate TypeScript contract and encoding repairs'
          git push origin HEAD:repair/batch-fix
