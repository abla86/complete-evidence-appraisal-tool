name: Batch Repair
on:
  push:
    branches: [repair/batch-fix]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply consolidated repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          def fix(s):
              pairs=[('\u00c3\u00b8','\u00f8'),('\u00c3\u00a5','\u00e5'),('\u00c3\u00a6','\u00e6'),('\u00c3\u0085','\u00c5'),('\u00c3\u0086','\u00c6'),('\u00c2\u00b7','\u00b7'),('\u00e2\u20ac\u0093','\u2013'),('\u00e2\u20ac\u0094','\u2014'),('\u00e2\u0086\u0092','\u2192'),('\u00e2\u0080\u00a6','\u2026')]
              for a,b in pairs: s=s.replace(a,b)
              return s
          for p in list((root/'src').rglob('*.ts'))+list((root/'src').rglob('*.tsx')):
              p.write_text(fix(p.read_text(encoding='utf-8-sig')),encoding='utf-8')
          p=root/'src/components/ArticleDetailView.tsx'; s=p.read_text(encoding='utf-8-sig'); s=re.sub(r"err instanceof Error \? err\.message : '[^']+' \|\| 'Kunne ikke gjenåpne'","err instanceof Error ? err.message : 'Kunne ikke gjenåpne'",s); p.write_text(s,encoding='utf-8')
          p=root/'src/components/MetaResearchLabView.tsx'; s=p.read_text(encoding='utf-8-sig').replace("parseInt(report.extractedYear || '2024', 10) || 2024","Number(report.extractedYear) || 2024"); p.write_text(s,encoding='utf-8')
          p=root/'src/components/PeerReviewStudioView.tsx'; s=p.read_text(encoding='utf-8-sig'); s=s.replace("setEvalOverallVerdict(mySubmission.overallVerdict);","setEvalOverallVerdict((mySubmission.overallVerdict ?? 'Inkluder') as NonNullable<PeerReviewSubmission['overallVerdict']>);"); needle="const consensusRecord: StudyConsensusRecord = {\n      studyId: selectedArticle.id,"; repl="const consensusRecord: StudyConsensusRecord = {\n      id: `consensus-${selectedArticle.id}-${Date.now()}`,\n      studyId: selectedArticle.id,\n      reviewerIds: workspace.members.slice(0, 2).map(m => m.id),\n      consensusStatus: consensusDraft.overallVerdict === 'Inkluder' ? 'Ja' : consensusDraft.overallVerdict === 'Ekskluder' ? 'Nei' : 'Uklart',\n      rationale: consensusDraft.verdictRationale || consensusDraft.consensusNotes || 'Konsensus fastsatt etter strukturert dobbeltgransking.',"; s=s.replace(needle,repl); p.write_text(s,encoding='utf-8')
          p=root/'src/components/UniversalAppraisalView.tsx'; s=p.read_text(encoding='utf-8-sig').replace("verifiedBy?: string; verifiedAt?: string;","verifiedBy?: string; verifiedAt?: string; verifiedByResearcher?: boolean;").replace("<QualityAssessmentPanel appraisalSession={session} studyId={studyId} />","<QualityAssessmentPanel session={session} />"); p.write_text(s,encoding='utf-8')
          p=root/'src/components/guidance/YggdrasilVisualizer.tsx'; s=p.read_text(encoding='utf-8-sig'); s=re.sub(r'\s+xmlns="[^"]+"','',s); p.write_text(s,encoding='utf-8')
          p=root/'src/components/WhoValidationHubView.tsx'; s=p.read_text(encoding='utf-8-sig'); start=s.index("const [cerqualFindings"); end=s.index("const handleRecalculateCerqual",start); block=s[start:end]; block=re.sub(r"reviewFinding:\s*('(?:[^']*)'),",r"finding: \1,\n      reviewFinding: \1,",block); block=re.sub(r"overallConfidence:\s*('(?:[^']*)'),",r"confidence: \1,\n      overallConfidence: \1,",block); block=re.sub(r"explanation:\s*('(?:[^']*)'),",r"rationale: \1,\n      explanation: \1,",block); s=s[:start]+block+s[end:]; s=re.sub(r"(evaluateFinding\(\{\n)\s*finding:[^\n]+,\n",r"\1",s); p.write_text(s,encoding='utf-8')
          p=root/'src/services/methodologyContractTests.ts'; s=p.read_text(encoding='utf-8-sig').replace("Agree2ScoringService.evaluate({ 1: 7, 2: 7, 3: 7 }, 1)","Agree2ScoringService.evaluate({ 1: 7, 2: 7, 3: 7 })").replace("Agree2ScoringService.evaluate({ 1: 1, 2: 1, 3: 1 }, 1)","Agree2ScoringService.evaluate({ 1: 1, 2: 1, 3: 1 })"); p.write_text(s,encoding='utf-8')
          p=root/'test/referenceHubDomain.test.ts'; s=p.read_text(encoding='utf-8-sig').replace("    type: 'JOURNAL_ARTICLE',","    kind: 'JOURNAL_ARTICLE',").replace("    sourceSystems: ['pubmed'],\n",''); p.write_text(s,encoding='utf-8')
          PY
      - name: Typecheck
        run: npx tsc --noEmit --pretty false
      - name: Tests
        run: npm test -- --test-concurrency=1
      - name: Build
        run: npm run build
      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src test
          git diff --cached --quiet && exit 0
          git commit -m 'fix: consolidate TypeScript contract and encoding repairs'
          git push origin HEAD:repair/batch-fix
