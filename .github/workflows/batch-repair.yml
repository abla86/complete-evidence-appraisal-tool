name: Batch Repair
on:
  push:
    branches: [repair/batch-fix]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply consolidated repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          def fix(s):
              pairs=[((0xC3,0xB8),0xF8),((0xC3,0xA5),0xE5),((0xC3,0xA6),0xE6),((0xC3,0x85),0xC5),((0xC3,0x86),0xC6),((0xC2,0xB7),0xB7),((0xE2,0x80,0x93),0x2013),((0xE2,0x80,0x94),0x2014),((0xE2,0x86,0x92),0x2192),((0xE2,0x80,0xA6),0x2026)]
              for codes,out in pairs: s=s.replace(''.join(map(chr,codes)),chr(out))
              return s
          for p in list((root/'src').rglob('*.ts'))+list((root/'src').rglob('*.tsx')):
              s=p.read_text(encoding='utf-8-sig'); p.write_text(fix(s),encoding='utf-8')
          p=root/'src/components/ArticleDetailView.tsx'; s=p.read_text(encoding='utf-8-sig'); s=re.sub(r"err instanceof Error \? err\.message : '[^']+' \|\| 'Kunne ikke gjenåpne'","err instanceof Error ? err.message : 'Kunne ikke gjenåpne'",s); p.write_text(s,encoding='utf-8')
          p=root/'src/components/MetaResearchLabView.tsx'; s=p.read_text(encoding='utf-8-sig').replace("parseInt(report.extractedYear || '2024', 10) || 2024","Number(report.extractedYear) || 2024"); p.write_text(s,encoding='utf-8')
          p=root/'src/components/PeerReviewStudioView.tsx'; s=p.read_text(encoding='utf-8-sig'); s=re.sub(r"setEvalOverallVerdict\(mySubmission\.overallVerdict\);","setEvalOverallVerdict((mySubmission.overallVerdict ?? 'Inkluder') as NonNullable<PeerReviewSubmission['overallVerdict']>);",s); needle="const consensusRecord: StudyConsensusRecord = {\n      studyId: selectedArticle.id,"; repl="const consensusRecord: StudyConsensusRecord = {\n      id: `consensus-${selectedArticle.id}-${Date.now()}`,\n      studyId: selectedArticle.id,\n      reviewerIds: workspace.members.slice(0, 2).map(m => m.id),\n      consensusStatus: consensusDraft.overallVerdict === 'Inkluder' ? 'Ja' : consensusDraft.overallVerdict === 'Ekskluder' ? 'Nei' : 'Uklart',\n      rationale: consensusDraft.verdictRationale || consensusDraft.consensusNotes || 'Konsensus fastsatt etter strukturert dobbeltgransking.',"; s=s.replace(needle,repl); p.write_text(s,encoding='utf-8')
          p=root/'src/components/UniversalAppraisalView.tsx'; s=p.read_text(encoding='utf-8-sig').replace("verifiedBy?: string; verifiedAt?: string;","verifiedBy?: string; verifiedAt?: string; verifiedByResearcher?: boolean;").replace("<QualityAssessmentPanel appraisalSession={session} studyId={studyId} />","<QualityAssessmentPanel session={session} />"); p.write_text(s,encoding='utf-8')
          p=root/'src/components/guidance/YggdrasilVisualizer.tsx'; s=p.read_text(encoding='utf-8-sig').replace(' xmlns="http://www.w3.org/2000/svg"',''); p.write_text(s,encoding='utf-8')
          p=root/'src/components/WhoValidationHubView.tsx'; s=p.read_text(encoding='utf-8-sig'); s=re.sub(r"(id:\s*'cerq-\d+',\n\s*)reviewFinding:\s*([^,\n]+),",r"\1finding: \2,\n      rationale: 'Rationale dokumentert i forklaringen.',\n      reviewFinding: \2,",s); s=re.sub(r"(overallConfidence:\s*[^,\n]+,)",r"confidence: \1.split(':',1)[1].strip().rstrip(','),\n      \1",s); s=s.replace("finding: \1","finding: \1") if False else s; s=s.replace("        finding: ","        finding: "); s=re.sub(r"const evalRes = GradeCerqualAssessmentEngine\.evaluateFinding\(\{\n\s*finding:[^\n]+,\n", "const evalRes = GradeCerqualAssessmentEngine.evaluateFinding({\n", s); p.write_text(s,encoding='utf-8')
          p=root/'src/services/methodologyContractTests.ts'; s=p.read_text(encoding='utf-8-sig').replace("Agree2ScoringService.evaluate({ 1: 7, 2: 7, 3: 7 }, 1)","Agree2ScoringService.evaluate({ 1: 7, 2: 7, 3: 7 })").replace("Agree2ScoringService.evaluate({ 1: 1, 2: 1, 3: 1 }, 1)","Agree2ScoringService.evaluate({ 1: 1, 2: 1, 3: 1 })"); s=s.replace("const robisEval = RobisValidationService.evaluate({\n      phase1PicoAddressed: true,\n      domain1Eligibility: 'Low risk',\n      domain2Identification: 'High risk',\n      domain3DataCollection: 'Low risk',\n      domain4Synthesis: 'Low risk'\n    });","const robisEval = RobisValidationService.evaluate({\n      phase2Domains: { domain1Eligibility: 'Low risk', domain2Identification: 'High risk', domain3DataCollection: 'Low risk', domain4Synthesis: 'Low risk' }\n    });"); p.write_text(s,encoding='utf-8')
          p=root/'test/referenceHubDomain.test.ts'; s=p.read_text(encoding='utf-8-sig').replace("    type: 'JOURNAL_ARTICLE',","    kind: 'JOURNAL_ARTICLE',").replace("    sourceSystems: ['pubmed'],\n",''); p.write_text(s,encoding='utf-8')
          PY
      - name: Typecheck
        run: npx tsc --noEmit --pretty false
      - name: Tests
        run: npm test -- --test-concurrency=1
      - name: Build
        run: npm run build
      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src test
          git diff --cached --quiet && exit 0
          git commit -m 'fix: consolidate TypeScript contract and encoding repairs'
          git push origin HEAD:repair/batch-fix
