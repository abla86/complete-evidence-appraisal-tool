name: PR34 repair and verification

on:
  workflow_dispatch:

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/complete-production-verification
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Synchronize with main
        run: |
          git fetch origin main
          git merge origin/main --no-edit -X ours
          git push origin HEAD:feat/complete-production-verification
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
