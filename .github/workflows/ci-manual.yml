name: CI Manual Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build production container
        run: docker build -t evidence-app:manual-ci .

      - name: Verify production container health
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name evidence-app-manual-ci -p 18080:10000 evidence-app:manual-ci
          trap 'docker rm -f evidence-app-manual-ci >/dev/null 2>&1 || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18080/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs evidence-app-manual-ci
          exit 1
