name: Evidence Tool Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Package nightly artifact
        run: |
          rm -rf nightly
          mkdir -p nightly
          cp -r dist nightly/dist
          cp package.json nightly/package.json
          cp package-lock.json nightly/package-lock.json
      - name: Upload nightly artifact
        uses: actions/upload-artifact@v7
        with:
          name: evidence-tool-nightly
          path: nightly/
          if-no-files-found: error
          retention-days: 7
