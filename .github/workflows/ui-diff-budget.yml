name: UI Diff Budget

on:
  workflow_dispatch:

jobs:
  ui-diff-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check App/Header deletion budget
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_SHA: ${{ github.sha }}
        run: node .github/scripts/check-ui-diff.mjs
