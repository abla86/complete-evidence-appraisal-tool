name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Environment
        run: |
          node --version
          npm --version
          docker --version

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm ci --no-audit --no-fund 2>&1 | tee ci-install.log

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit 2>&1 | tee ci-typecheck.log

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint 2>&1 | tee ci-lint.log

      - name: Test
        id: test
        continue-on-error: true
        run: npm test -- --test-concurrency=1 2>&1 | tee ci-test.log

      - name: Production build
        id: build
        continue-on-error: true
        run: npm run build 2>&1 | tee ci-build.log

      - name: Docker build
        id: docker
        continue-on-error: true
        run: docker build --progress=plain -t complete-evidence-appraisal-tool:${GITHUB_SHA} . 2>&1 | tee ci-docker.log

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ github.run_id }}
          path: |
            ci-*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Enforce green pipeline
        if: always()
        run: |
          test "${{ steps.install.outcome }}" = "success"
          test "${{ steps.typecheck.outcome }}" = "success"
          test "${{ steps.lint.outcome }}" = "success"
          test "${{ steps.test.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
          test "${{ steps.docker.outcome }}" = "success"
