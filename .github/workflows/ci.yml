name: CI

on:
  push:
    branches: [main, 'integration/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend restore
        run: dotnet restore EvidenceAppraisalTool.sln

      - name: Backend build
        run: dotnet build EvidenceAppraisalTool.sln --configuration Release --no-restore

      - name: Backend test
        run: dotnet test EvidenceAppraisalTool.sln --configuration Release --no-build --collect:"XPlat Code Coverage"

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend test
        working-directory: frontend
        run: npm test

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Repository audit
        shell: pwsh
        run: ./tools/audit-and-build.ps1 -SkipBuild -SkipTests
