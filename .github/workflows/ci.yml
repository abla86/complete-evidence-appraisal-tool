name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: v8-coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 7

      - name: Production build
        run: npm run build

      - name: Build production container
        run: docker build --progress=plain -t complete-evidence-appraisal-tool:${GITHUB_SHA} .

      - name: Verify production container health
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name evidence-app-ci -p 18080:10000 complete-evidence-appraisal-tool:${GITHUB_SHA}
          trap 'docker rm -f evidence-app-ci >/dev/null 2>&1 || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18080/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs evidence-app-ci
          exit 1
