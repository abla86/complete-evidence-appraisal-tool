name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit > tsc-errors.txt 2>&1
      - name: Publish typecheck diagnostics
        if: steps.typecheck.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('tsc-errors.txt', 'utf8').slice(0, 60000);
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: '### TypeScript diagnostics\n\n```text\n' + output + '\n```'});
      - name: Fail typecheck gate
        if: steps.typecheck.outcome == 'failure'
        run: exit 1
      - name: Build frontend and backend
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Build production container
        run: docker build -t evidence-app:test .
      - name: Verify production container health
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name evidence-app-ci -p 18080:10000 evidence-app:test
          trap 'docker rm -f evidence-app-ci >/dev/null 2>&1 || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18080/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs evidence-app-ci
          exit 1
